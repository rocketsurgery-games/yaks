herd: yaks

# Default verification commands, resolved by a yak's labels when it has no
# explicit `verify:` field (see `yaks verify`). First matching label wins;
# `default` is the fallback. The project's levers, named once.
verify:
  # ui = the pass/fail GATE (the tui insta snapshot tests). SVGs are a separate
  # visual channel, generated on demand (cargo test -p yaks docshots -- --ignored)
  # and attached for human review — not a shear gate. See yaks-6c93.
  ui: cargo test -p yaks
  cli: cargo test -p yaks
  skills: cargo test -p yaks skills
  default: cargo test --workspace

# Declared herds (id prefixes) in this farm. The real work is the `yaks` herd;
# `test` is a demo herd showing per-herd config (its own default_type + verify
# lever) and the multi-herd TUI (id colouring + the create-form herd picker).
herds:
  yaks:
  test:
    default_type: chore
    verify:
      default: echo test-herd-lever
