<svg xmlns="http://www.w3.org/2000/svg" width="826" height="380" viewBox="0 0 826 380" font-size="14">
<!-- The ONLY structural difference from plain flow: an embedded, metric-pinned
     font. It is subset+remapped so that at font-size:14 every text glyph advances
     exactly CW=8.4px (0.6em) and every emoji advances exactly 2 cells=16.8px
     (1.2em). Because the font grid now equals the px grid, the body needs no
     textLength, no lengthAdjust, and no per-run x — and it renders identically
     in any viewer (GitHub, browser, Inkscape) instead of depending on whatever
     monospace the viewer happens to have. -->
<style>
@font-face{
  font-family:"yaks-mono";
  font-display:block;
  src:url("data:font/woff2;base64,d09GMgABAAAAAB…<subset: text glyphs @0.6em + 🦬🪒🐑🕒⭐⏳ @1.2em>…AA==") format("woff2");
}
text{font-family:"yaks-mono";white-space:pre}
.b0{fill:#eaeaea}
.b1{fill:#3a3a3a}
.s0{opacity:.6}
.s1{fill:#1d1f21;font-weight:bold}
.s2{font-weight:bold}
.s3{fill:#81a2be}
.s4{fill:#b294bb}
.s5{fill:#8abeb7}
.s6{fill:#b294bb;opacity:.6}
.s7{fill:#f0c674;font-weight:bold}
.s8{fill:#f0c674}
.s9{fill:#b294bb;font-weight:bold}
.s10{fill:#81a2be;opacity:.6}
.s11{fill:#f0c674;opacity:.6}
.s12{fill:#8abeb7;opacity:.6}
.s13{fill:#969896}
</style>
<rect x="0" y="0" width="826" height="380" rx="8" fill="#1d1f21"/>
<rect class="b0" x="136.0" y="10.0" width="17.3" height="18.0"/>
<rect class="b0" x="161.2" y="10.0" width="109.7" height="18.0"/>
<rect class="b1" x="10.0" y="46.0" width="218.9" height="18.0"/>
<rect class="b1" x="236.8" y="46.0" width="580.1" height="18.0"/>
<!-- Body: pure flow. One <text> per row at the left margin; each row is literal
     text with <tspan class> only where color/weight changes. No x, no textLength,
     no lengthAdjust anywhere. Reads top-to-bottom, left-to-right like the toque
     snapshot. Every emoji is a single 2-cell glyph, so nothing after it shifts. -->
<g fill="#c5c8c6">
<text x="10.0" y="23.5"><tspan class="s0"> 🦬</tspan> <tspan class="s0"> Hairy (2) </tspan> <tspan class="s1"> 🪒</tspan> <tspan class="s1"> Shaving (3) </tspan> <tspan class="s0"> 🐑</tspan> <tspan class="s0"> Shorn (1) </tspan> <tspan class="s0"> 🕒</tspan> <tspan class="s0"> Recent (6) </tspan> <tspan class="s0"> ⭐</tspan> <tspan class="s0"> Starred (0) </tspan></text>
<text x="10.0" y="59.5"> yaks-3901   <tspan class="s2">p1 </tspan>task     🪒  Coordination substrate for parallel yak-shaving         <tspan class="s0">[coord, git]</tspan></text>
<text x="10.0" y="77.5"> <tspan class="s3">  yaks-b517 </tspan><tspan class="s4">p2 </tspan><tspan class="s5">feature  </tspan>🪒  HITL: needs-human frontmatter + inbox surfacing         <tspan class="s6">[cli, ui]</tspan> <tspan class="s7">⏳</tspan></text>
<text x="10.0" y="95.5"> <tspan class="s3">  yaks-3677 </tspan><tspan class="s8">p3 </tspan><tspan class="s5">feature  </tspan>🪒  TUI doc screenshots via headless buffer-&gt;SVG              <tspan class="s6">[ui, docs]</tspan></text>
<text x="10.0" y="113.5"><tspan class="s9">*</tspan><tspan class="s10">  yaks-70e5 </tspan><tspan class="s11">p3 </tspan><tspan class="s12">feature  </tspan><tspan class="s0">🦬</tspan> <tspan class="s0"> yaks diff &lt;refA&gt; &lt;refB&gt;: ref-generic herd diff</tspan>                 <tspan class="s6">[cli]</tspan></text>
<text x="10.0" y="365.5"><tspan class="s13">Tab:view  j/k:move  l:detail  h:herd  v:views  c/C:new  E:edit  X:del  S:state  D:dep  f:filter</tspan></text>
</g>
</svg>
