[workspace]
members = ["crates/toque"]
# The root `yaks` package is implicitly a workspace member alongside crates/*.

[package]
name = "yaks"
version = "0.0.1"
edition = "2024"
description = "Filesystem-native task tracker: a fast single-binary CLI + TUI over markdown task files"
license = "Apache-2.0"
repository = "https://github.com/rocketsurgery-games/yaks"
default-run = "yaks"

[[bin]]
name = "yaks"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = { version = "1", features = ["preserve_order"] }
ratatui = "0.30"
edtui = { version = "0.11.7", default-features = false }
toque = { path = "crates/toque" }
notify = "6"
arboard = "3"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
assert_cmd = "2"
insta = "1"
