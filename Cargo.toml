[workspace]
members = ["crates/toque"]
# The root `yaks` package is implicitly a workspace member alongside crates/*.

[package]
name = "yaks"
version = "0.0.1"
edition = "2024"
description = "Filesystem-native task tracker (Rust port — Phase 0 spike)"
license = "Apache-2.0"
repository = "https://github.com/rocketsurgery-games/yaks"
default-run = "yaks"

[[bin]]
name = "yaks"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = { version = "1", features = ["preserve_order"] }
ratatui = "0.30"
edtui = { version = "0.11.7", default-features = false }
toque = { path = "crates/toque" }
notify = "6"
arboard = "3"
png = "0.17"

# Planned, not yet wired — see README roadmap and the yak-2219 research arc:
#   ratatui + crossterm   TUI                                  (yak-ef0f)
#   edtui                 embedded modal editor                (yak-6819)
#   rkyv                  zero-copy derived index              (yak-1622)
#   avt                   virtual-terminal oracle for tests    (yak-199b)
#   tempfile, fs4, insta, assert_cmd                          (yak-90b8)

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
assert_cmd = "2"
insta = "1"
